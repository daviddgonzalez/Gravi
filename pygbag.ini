[DEPENDENCIES]
# Keep out of the browser package. Everything listed here is still built,
# tested and shipped natively — this only controls what a visitor downloads.
#
#   .venv        — the local virtualenv, never part of the app
#   src/gravi/ai — the GA trainer. Core spec section 8.6: it runs natively
#                  and never in the browser. Nothing in main.py imports it,
#                  so shipping it was dead weight in every page load.
#
# docs/ is deliberately NOT listed: keeping it in the package is a decision,
# not an oversight.
ignoreDirs = ["/.venv", "/src/gravi/ai"]
ignoreFiles = []

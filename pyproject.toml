[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravi"
version = "0.1.0"
description = "An endless polarity game — you never jump, you push and pull against the world"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pygbag>=0.9",
    "gravi[train]",
]
# The offline trainer and validator only. Deliberately NOT a runtime dependency:
# the game ships pygame-ce and nothing else, and everything in [project]
# dependencies has to survive WebAssembly. The trainer runs natively and never
# in the browser (spec section 8.6), so numpy is fine here and nowhere else.
# What the trainer *emits* must still load in the browser, which is why
# checkpoints are JSON rather than .npy.
train = [
    "numpy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
